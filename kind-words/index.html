            <p>Matt has an outstanding eye for design and an intuitive understanding of how people consume digital content. He is constantly learning — keeping up with email trends, accessibility standards, evolving technologies, and the competitive landscape — and he brings those insights back to the team in practical, meaningful ways. He cares deeply about helping people communicate clearly and effectively, and it shows in everything he creates.</p>
            <details>
              <summary>Read full recommendation</summary>
              <p>I’ve been fortunate to work with Matt Dionne in several different roles during my time at Constant Contact, and every experience has reinforced what an exceptional professional he is. When I joined the company in 2018 on the mobile application team, Matt was already a recognized expert in email and was one of the key architects behind the document format that still powers our email editor today. Working alongside him, I was continually impressed by the depth of his knowledge, his thoughtful approach to solving problems, and his unwavering focus on creating the best possible experience for customers.</p>
              <p>I later had the privilege of managing Matt on the Templates team, where I saw firsthand the breadth of his talents. Matt has an outstanding eye for design and an intuitive understanding of how people consume digital content. He is constantly learning—keeping up with email trends, accessibility standards, evolving technologies, and the competitive landscape—and he brings those insights back to the team in practical, meaningful ways. He cares deeply about helping people communicate clearly and effectively, and it shows in everything he creates. Beyond his expertise, Matt is a trusted teammate who shares knowledge freely, welcomes collaboration, and consistently raises the quality of the work around him.</p>
              <p>While Matt is widely known for his expertise in email marketing, his strengths extend far beyond that domain. His combination of product vision, user-centered design thinking, accessibility expertise, communication skills, and deep understanding of digital experiences would make him an asset to any organization building customer-facing products. Whether the focus is marketing technology, product design, digital communications, or creating exceptional user experiences, Matt has the talent, curiosity, and professionalism to make a meaningful impact. I would welcome the opportunity to work with him again without hesitation.</p>
            </details>
